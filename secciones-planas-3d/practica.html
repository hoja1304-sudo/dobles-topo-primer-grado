<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secciones planas · Práctica</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/auto-render.min.js"></script>
<style>
  :root{
    --ink:#15202b;--muted:#5b6b7a;--line:#d7dee6;--bg:#eef1f5;--card:#ffffff;
    --accent:#0f766e;--accent-soft:#e6f4f1;--ok:#15803d;--bad:#b91c1c;--warm:#b45309
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100dvh}
  /* ---- toolbar ---- */
  .toolbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 18px;background:#0e1b2b;color:#eaf1f8;border-bottom:1px solid #22354a}
  .tbar-title{font-weight:700;font-size:1rem}
  .tbar-spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #2a3a4e;background:#15283c;color:#eaf1f8;
    font-weight:650;font-size:.86rem;padding:9px 14px;border-radius:9px;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
  .btn:hover{background:#1c3349;border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#0b5e57}
  .btn.link{background:transparent;border-color:#2a3a4e}
  .btn:focus-visible{outline:2px solid #5eead4;outline-offset:2px}
  /* ---- sheet ---- */
  .sheet{max-width:980px;margin:18px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 10px 30px rgba(15,32,43,.08);padding:22px 24px 26px}
  .sheet-head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
  .sheet-head h1{margin:0;font-size:1.22rem;letter-spacing:-.01em}
  .sheet-head p{margin:4px 0 0;color:var(--muted);font-size:.86rem}
  .items{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
  .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fcfdfe;break-inside:avoid}
  .q{font-size:12pt;line-height:1.4}
  .num{font-weight:700;color:var(--accent);margin-right:4px}
  .fig{display:flex;justify-content:center;margin:8px 0}
  .fig svg{height:92px;width:auto;display:block}
  .fig.big svg{height:152px}
  .opts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
  .opt{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font-family:inherit;font-size:12pt;
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s}
  .opt:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
  .opt:disabled{cursor:default}
  .opt .letter{font-weight:700;color:var(--accent)}
  .opt.correct{background:#e9f9ee;border-color:var(--ok)}
  .opt.correct .letter{color:var(--ok)}
  .opt.wrong{background:#fdecec;border-color:var(--bad)}
  .opt.wrong .letter{color:var(--bad)}
  .opt .mark{margin-left:auto;font-weight:800;font-size:1.05rem;line-height:1}
  .opt.correct .mark{color:var(--ok)}
  .opt.wrong .mark{color:var(--bad)}
  .fb{margin-top:10px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .fb-head{display:flex;align-items:center;gap:8px;padding:8px 11px;font-weight:700;font-size:.92rem}
  .fb.ok .fb-head{background:#e9f9ee;color:var(--ok)}
  .fb.bad .fb-head{background:#fdecec;color:var(--bad)}
  .fb-head .ico{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:.9rem;font-weight:800}
  .fb.ok .fb-head .ico{background:var(--ok)}
  .fb.bad .fb-head .ico{background:var(--bad)}
  .fb-sol{padding:10px 12px;background:#fff;font-size:11.5pt;line-height:1.5}
  .fb-sol b{display:block;margin-bottom:4px;color:var(--accent);font-size:.82rem;text-transform:uppercase;letter-spacing:.03em}
  @media (max-width:720px){
    .items{grid-template-columns:1fr}
    .sheet{margin:12px;padding:16px}
  }
  /* ---- print: carta, una hoja ---- */
  @media print{
    @page{size:Letter;margin:1cm}
    html,body{background:#fff}
    .toolbar{display:none !important}
    .sheet{max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;padding:0}
    .sheet-head h1{font-size:14pt}
    .items{gap:10px 40px}
    .item{background:#fff;break-inside:avoid;padding:8px 10px}
    .q{font-size:12pt}
    .opts{gap:2px}
    .opt{font-size:12pt;padding:1px 0;border:none !important;background:transparent !important;border-radius:0}
    .opt:disabled{background:transparent !important}
    .opt .letter{color:#000}
    .opt .mark{display:none}
    .fb{display:none !important}
    .fig svg{height:78px}
    .fig.big svg{height:118px}
  }
</style>
</head>

<script>
const PRACTICES=[
  /* ---------- Práctica 1 ---------- */
  [
    {q:"Karen elaboró dos artesanías a partir de una tuca (trozo de madera) con forma de cilindro circular recto. El diámetro de una base mide $40$ cm. A la tuca se le hace un corte plano paralelo a sus bases. ¿Cuál es el área, en centímetros cuadrados, de la sección plana obtenida?",
     opts:["$40\\pi$","$80\\pi$","$400\\pi$","$1600\\pi$"],correct:2,
     sol:"El corte paralelo a las bases genera un círculo del mismo radio. Radio $=\\dfrac{40}{2}=20$ cm. Área $=\\pi r^2=\\pi(20)^2=400\\pi$ cm²."},
    {q:"A un cilindro circular recto de $100$ cm de altura y $20$ cm de diámetro se le realiza un corte perpendicular a las bases, a una distancia de $6$ cm respecto del centro de la base. ¿Cuál es el área, en cm², de la sección plana obtenida?",
     fig:"cilPerp",opts:["$2000$","$1600$","$1200$","$800$"],correct:1,
     sol:"La sección es un rectángulo. Un lado es la altura: $100$ cm. El otro es la cuerda $2\\sqrt{r^2-d^2}=2\\sqrt{10^2-6^2}=2\\sqrt{64}=16$ cm. Área $=100\\times16=1600$ cm²."},
    {q:"Un recipiente se fabrica con una esfera de vidrio de radio $26$ cm, haciéndole dos cortes planos paralelos del mismo tamaño (la base y la abertura). La distancia entre los centros de las secciones es $48$ cm. ¿Cuál es el radio de la abertura?",
     fig:"recipiente",opts:["$40$ cm","$35$ cm","$22$ cm","$10$ cm"],correct:3,
     sol:"Al ser del mismo tamaño, las secciones equidistan del centro: $d=\\dfrac{48}{2}=24$ cm. Radio de la sección $=\\sqrt{R^2-d^2}=\\sqrt{26^2-24^2}=\\sqrt{100}=10$ cm."},
    {q:"A una varilla con forma de cilindro circular recto se le hace un corte plano oblicuo respecto a sus bases, sin intersecarlas. ¿Qué figura geométrica corresponde a la sección plana obtenida?",
     opts:["Elipse","Parábola","Rectángulo","Circunferencia"],correct:0,
     sol:"Un plano oblicuo a las bases que corta toda la superficie lateral, sin tocar las bases, genera una elipse."}
  ],
  /* ---------- Práctica 2 ---------- */
  [
    {q:"Una persona artesana trabaja un bloque de cera con forma de cilindro circular recto, de radio $8$ cm y altura $24$ cm. Realiza un corte plano que pasa por el centro de ambas bases y es perpendicular a ellas. ¿Cuál es el perímetro, en cm, de la sección obtenida?",
     opts:["$32$","$64$","$80$","$192$"],correct:2,
     sol:"La sección es un rectángulo de base igual al diámetro, $2(8)=16$ cm, y altura $24$ cm. Perímetro $=2(16+24)=80$ cm."},
    {q:"Una esfera de centro $A$ y radio $25\\sqrt{2}$ cm recibe un corte plano cuya circunferencia tiene centro $M$, con $AM=25$ cm. ¿Cuál es el radio, en cm, de la circunferencia generada por el corte?",
     fig:"esferaCorte",figBig:true,opts:["$25$","$50$","$\\sqrt{1250}$","$2\\sqrt{1250}$"],correct:0,
     sol:"$r=\\sqrt{R^2-AM^2}=\\sqrt{(25\\sqrt{2})^2-25^2}=\\sqrt{1250-625}=\\sqrt{625}=25$ cm."},
    {q:"A una pieza con forma de cono circular recto se le hace un corte plano oblicuo a su base y sin intersecarla, para obtener dos trozos. ¿A qué figura corresponde la sección plana obtenida?",
     opts:["Elipse","Parábola","Hipérbola","Circunferencia"],correct:0,
     sol:"Al cortar oblicuamente todas las generatrices del cono, sin tocar la base, la sección obtenida es una elipse."},
    {q:"Un bloque de queso con forma de cilindro circular recto de $40$ cm de altura y $15$ cm de radio se corta perpendicularmente a sus bases, pasando por los centros de ambas. ¿Cuál es el área, en cm², de la superficie del corte?",
     fig:"cilPerp",opts:["$300$","$600$","$1200$","$2400$"],correct:2,
     sol:"La sección es un rectángulo de base igual al diámetro, $2(15)=30$ cm, y altura $40$ cm. Área $=30\\times40=1200$ cm²."}
  ],
  /* ---------- Práctica 3 ---------- */
  [
    {q:"Un artesano usa una pieza con forma de cono circular recto. Le realiza un corte plano paralelo a la base, sin pasar por el vértice. ¿Qué forma tiene la sección plana obtenida?",
     opts:["Una parábola","Una hipérbola","Un rectángulo","Una circunferencia"],correct:3,
     sol:"Todo corte paralelo a la base de un cono, que no pase por el vértice, produce una circunferencia."},
    {q:"Se interseca un cono circular recto con un plano que no pasa por su vértice y es perpendicular a la base. ¿A qué corresponde la sección plana formada?",
     fig:"cono",opts:["Elipse","Hipérbola","Circunferencia","Parábola"],correct:1,
     sol:"Un plano perpendicular a la base que no pasa por el vértice corta la superficie generando una hipérbola."},
    {q:"El diámetro de la base de un cono circular recto es $10$. Se le hace un corte paralelo a la base; la distancia desde la cúspide al centro de la sección es $6$ y la distancia desde el corte hasta la base es $8$. ¿Cuál es el radio de la sección generada?",
     opts:["$\\dfrac{15}{4}$","$\\dfrac{35}{3}$","$\\dfrac{15}{7}$","$\\dfrac{35}{4}$"],correct:2,
     sol:"La altura total es $6+8=14$ y el radio de la base es $5$. Por semejanza $\\dfrac{r}{5}=\\dfrac{6}{14}$, de donde $r=\\dfrac{30}{14}=\\dfrac{15}{7}$."},
    {q:"Un adorno se forma con un cilindro y una esfera de radio $5$ cm a la que se le hace un corte a $3$ cm de su centro. ¿Cuál debe ser el diámetro de la base del cilindro para que el área de la sección y el área de la base sean iguales?",
     opts:["$6$","$8$","$10$","$19$"],correct:1,
     sol:"Radio de la sección $=\\sqrt{5^2-3^2}=\\sqrt{16}=4$ cm, con área $\\pi(4)^2=16\\pi$. En la base, $\\pi r^2=16\\pi\\Rightarrow r=4$, por lo que el diámetro es $8$ cm."}
  ],

  [
    {q:"A una varilla con forma de cilindro circular recto se le hace un corte plano oblicuo respecto a sus bases, sin intersecarlas. ¿Qué figura plana corresponde a la sección obtenida en una de las partes?",
     fig:"cilObl",opts:["Elipse","Parábola","Rectángulo","Circunferencia"],correct:0,

    {q:"A una esfera de acrílico se le realiza un corte plano que pasa por su centro. ¿Qué figura plana, en la esfera, se obtuvo producto de ese corte?",

    {q:"Relacione cada corte con su sección. I. A un cilindro circular recto se le hace un corte oblicuo a las bases, sin intersecarlas. II. A un cono circular recto se le hace un corte oblicuo a la base y paralelo a una generatriz, sin pasar por el vértice.",

    {q:"A un estañón con forma de cilindro circular recto se le hace un corte perpendicular a las bases para fabricar una parrilla. ¿Qué figura plana se obtuvo en la parrilla producto de ese corte?",
     opts:["Una elipse","Un rectángulo","Una circunferencia","Un cuadrado"],correct:1,

  [
    {q:"A un tubo metálico con forma de cilindro circular recto se le realiza un corte plano oblicuo respecto a sus bases, sin intersecarlas, obteniéndose dos partes. ¿A qué corresponde la sección plana de una de las partes?",

    {q:"Un bloque con forma de cilindro circular recto de radio $9$ cm y altura $16$ cm se corta perpendicularmente a las bases, pasando por los centros de ambas. ¿Cuál es el área, en cm², de la sección obtenida?",

    {q:"A una esfera de radio $10$ cm se le hace un corte plano a $6$ cm de su centro. ¿Cuál es el radio, en cm, de la circunferencia generada por el corte?",
     opts:["$4$","$6$","$8$","$16$"],correct:2,
     sol:"$r=\\sqrt{R^2-d^2}=\\sqrt{10^2-6^2}=\\sqrt{100-36}=\\sqrt{64}=8$ cm."},
    {q:"A una pieza con forma de cono circular recto se le hace un corte plano paralelo a una de sus generatrices, sin pasar por el vértice. ¿Qué figura corresponde a la sección obtenida?",
     fig:"cono",opts:["Elipse","Parábola","Hipérbola","Circunferencia"],correct:1,
     sol:"Un plano paralelo a una generatriz del cono produce una parábola."}
  ]
];

const LETTERS=["A","B","C","D"];
let current=0;

function renderMath(el){
  if(typeof renderMathInElement==="function"){
    renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});
  }
}
function esc(s){return s;}

function buildPractice(idx){
  const cont=document.getElementById("items");
  cont.innerHTML="";
  PRACTICES[idx].forEach((it,qi)=>{
    const art=document.createElement("article");
    art.className="item";
    let html=`<div class="q"><span class="num">${qi+1}.</span><span class="enun">${it.q}</span></div>`;
    if(it.fig) html+=`<div class="fig${it.figBig?" big":""}" data-figkey="${it.fig}" role="img" aria-label="Figura del ítem ${qi+1}"></div>`;
    html+=`<ul class="opts">`;
    it.opts.forEach((op,oi)=>{
      html+=`<li><button class="opt" type="button" data-i="${oi}"><span class="letter">${LETTERS[oi]})</span><span class="otext">${op}</span><span class="mark"></span></button></li>`;
    });
    html+=`</ul>`;
    html+=`<div class="fb" hidden><div class="fb-head"><span class="ico"></span><span class="fb-label"></span></div><div class="fb-sol"><b>Solución paso a paso</b><div class="fb-text">${it.sol}</div></div></div>`;
    art.innerHTML=html;
    const figDiv=art.querySelector(".fig[data-figkey]");
    if(figDiv){const src=document.querySelector(`#figbank svg[data-fig="${figDiv.dataset.figkey}"]`);if(src)figDiv.appendChild(src.cloneNode(true));}
    const opts=art.querySelectorAll(".opt");
    opts.forEach(btn=>{
      btn.addEventListener("click",()=>answer(art,it,+btn.dataset.i,opts));
    });
    cont.appendChild(art);
  });
  renderMath(cont);
}

function answer(art,it,chosen,opts){
  if(art.dataset.done)return;
  art.dataset.done="1";
  const ok=chosen===it.correct;
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===it.correct){b.classList.add("correct");b.querySelector(".mark").textContent="✓";}
    if(i===chosen&&!ok){b.classList.add("wrong");b.querySelector(".mark").textContent="✗";}
  });
  const fb=art.querySelector(".fb");
  fb.classList.add(ok?"ok":"bad");
  fb.querySelector(".ico").textContent=ok?"✓":"✗";
  fb.querySelector(".fb-label").textContent=ok?"Respuesta correcta":"Respuesta incorrecta";
  fb.hidden=false;
}

function showPractice(idx){
  current=((idx%PRACTICES.length)+PRACTICES.length)%PRACTICES.length;
  const n=current+1;
  document.getElementById("tbarTitle").textContent=`Práctica ${n} de ${PRACTICES.length}`;
  document.getElementById("sheetTitle").textContent=`Práctica ${n} · Secciones planas`;
  buildPractice(current);
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("btnNew").addEventListener("click",()=>showPractice(current+1));
document.getElementById("btnPrint").addEventListener("click",()=>window.print());

showPractice(0);
</script>
</body>
</html>
